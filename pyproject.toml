[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-deal-desk"
version = "0.1.0"
description = "Loan application triage for vehicle and equipment finance (synthetic data demo)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
